# ResNet-18 and ResNet-50, frozen encoder only: python -m src.cli transfer --config configs/transfer_resnet18.yaml
# Add more encoders or fine-tune runs later by copying a run line (freeze: false, a smaller lr such as 3.0e-4).
defaults:
  epochs: 10
  batch_size: 32
  image_size: 224
  optimizer: adam
  weight_decay: 1.0e-4
  dropout: 0.3
  seed: 42
  num_workers: 2 # Colab and Kaggle give 2 CPU cores

runs:
  - { name: resnet18_frozen_adam, encoder: resnet18, freeze: true, lr: 1e-4 } # head only, random start: big steps
  - { name: resnet50_frozen_adam, encoder: resnet50, freeze: true, lr: 1e-4 }
