# ResNet-18 only, frozen vs fine-tune: python -m src.cli transfer --config configs/transfer_resnet18.yaml
# Add more encoders later by copying a run line (encoder: resnet50 or efficientnet_b0).
defaults:
  epochs: 10
  batch_size: 32
  image_size: 224
  optimizer: adam
  weight_decay: 1.0e-4
  dropout: 0.3
  seed: 42
  num_workers: 2 # Colab and Kaggle give 2 CPU cores

runs:
  - { name: resnet18_frozen_adam, encoder: resnet18, freeze: true, lr: 3.0e-3 } # head only, random start: big steps
  - {
      name: resnet18_finetune_adam,
      encoder: resnet18,
      freeze: false,
      lr: 3.0e-4,
    } # whole network: smaller steps
