# ResNet-50, fine-tune vs frozen: python -m src.cli transfer --config configs/transfer_resnet18.yaml
# Add more encoders (resnet18, efficientnet_b0) by copying a run line; fine-tune runs use freeze: false and a smaller lr.
defaults:
  epochs: 10
  batch_size: 32
  image_size: 224
  optimizer: adam
  weight_decay: 1.0e-4
  dropout: 0.3
  seed: 42
  num_workers: 2 # Colab and Kaggle give 2 CPU cores

runs:
  - {
      name: resnet50_finetune_adam,
      encoder: resnet50,
      freeze: false,
      lr: 3.0e-4,
    } # whole network: smaller steps
  - { name: resnet50_frozen_adam, encoder: resnet50, freeze: true, lr: 1.0e-3 } # head only, random start: bigger steps
