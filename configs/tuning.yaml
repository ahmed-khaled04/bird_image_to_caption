# Hyperparameter search for the classifier (Task 1.2, point 4): python -m src.cli tune
# Grid search and random search get the same number of trials and the same short training per trial.
# Trials are ranked on validation, never on test; the winner is then trained fully.
encoder: resnet18        # tune on the small model: much faster per trial than resnet50
freeze: false
epochs: 5                # per trial: enough to rank settings, not to converge
final_epochs: 10         # the winner is retrained (tune --retrain-best) as long as the transfer runs
seed: 42                 # the same for every trial, so trials differ only in their hyperparameters
metric: val_accuracy     # higher is better
random_trials: null      # null = as many as the grid has

# everything not tuned stays as in configs/transfer.yaml, so the tuned model is compared fairly with the untuned one
batch_size: 32
image_size: 224
optimizer: adamw
num_workers: 2

# The learning rate range depends on the encoder: fine-tuning pretrained weights needs about 10x smaller
# steps than training from scratch, or the first updates wipe out what ImageNet taught the network.
# Every random range covers the grid values, so random search can find anything the grid can.
spaces:
  scratch:
    grid:
      lr: [3.0e-4, 1.0e-3, 3.0e-3]
      weight_decay: [1.0e-4, 1.0e-2]
      dropout: [0.2, 0.5]
    random:
      lr: {log_uniform: [3.0e-4, 3.0e-3]}
      weight_decay: {log_uniform: [1.0e-4, 1.0e-2]}
      dropout: {uniform: [0.2, 0.5]}
  resnet18: &pretrained
    grid:
      lr: [3.0e-5, 1.0e-4, 3.0e-4]
      weight_decay: [1.0e-4, 1.0e-2]
      dropout: [0.2, 0.5]
    random:
      lr: {log_uniform: [3.0e-5, 3.0e-4]}
      weight_decay: {log_uniform: [1.0e-4, 1.0e-2]}
      dropout: {uniform: [0.2, 0.5]}
  resnet50: *pretrained
  efficientnet_b0: *pretrained
